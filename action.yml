name: "LangGraph Context-Aware Code Reviewer"
description: "AI agent that reviews PR diffs with AST-resolved context and posts findings as a comment."
branding:
  icon: "eye"
  color: "purple"
inputs:
  repo:
    description: "owner/repo of the PR to review, e.g. octocat/hello-world"
    required: true
  pr_number:
    description: "Pull request number"
    required: true
  github_token:
    description: >-
      Token used to read the PR and post the review comment. The
      workflow-provided GITHUB_TOKEN secret is sufficient — no custom
      PAT needed — as long as the job grants pull-requests: write.
    required: true
  gemini_api_key:
    description: "Google Gemini API key (free tier works)."
    required: true
  max_files:
    description: >-
      Maximum number of changed files to analyze. Files beyond this
      count are skipped (recorded in the review's notes) rather than
      sent to fetch_context/analyze, so one huge PR can't run unbounded.
    required: false
    default: "30"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    - name: Run review
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npx tsx src/agent.ts "${{ inputs.repo }}" "${{ inputs.pr_number }}" --post
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        MAX_FILES: ${{ inputs.max_files }}
